<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>404 — Page Not Found | GlowSlides</title>
  <meta name="description" content="The slide or page you are looking for does not exist or has been moved.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css">
  <meta property="og:title" content="404 — Page Not Found | GlowSlides">
  <meta property="og:description" content="AI-powered presentation builder creating boardroom-ready decks in seconds.">
  <meta property="og:image" content="/images/logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="bg-[#030712] text-[#f8fafc] font-sans antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-blue-600 selection:text-white">
  <!-- Glowing background elements -->
  <div class="pointer-events-none fixed inset-0 radial-glow z-0"></div>
  <div class="pointer-events-none fixed inset-0 cyber-grid z-0"></div>

  <!-- Header -->
  <header class="relative z-10 border-b border-white/[0.08] bg-[#030712]/80 backdrop-blur-xl">
    <div class="max-w-[1440px] mx-auto px-6 h-20 flex items-center justify-between">
      <a class="flex items-center gap-2.5 min-h-[44px]" href="/">
        <img alt="GlowSlides logo" class="w-8 h-8 rounded-lg object-cover" height="32" src="/images/logo.png" width="32" onerror="this.remove()">
        <span class="text-xl font-bold tracking-tight text-white">GlowSlides</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/dashboard" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-[0_0_15px_rgba(37,99,235,0.4)] transition">Open Studio →</a>
      </div>
    </div>
  </header>

  <!-- 404 Main Content -->
  <main class="relative z-10 max-w-xl w-full mx-auto px-6 py-20 flex-1 flex flex-col items-center justify-center text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-500/10 border border-blue-400/20 text-blue-400 font-mono text-xs font-semibold mb-6">
      <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
      ERROR 404 • ROUTE NOT FOUND
    </div>

    <h1 class="text-6xl sm:text-7xl font-extrabold text-white tracking-tight mb-4 font-mono">
      4<span class="text-blue-500">0</span>4
    </h1>
    
    <h2 class="text-xl sm:text-2xl font-bold text-slate-100 mb-3">
      This Slide Seems to Have Vanished
    </h2>

    <p class="text-sm text-slate-400 leading-relaxed max-w-md mx-auto mb-8">
      The presentation link or page you were looking for doesn't exist, was deleted, or was moved to another workspace.
    </p>

    <div class="flex flex-wrap items-center justify-center gap-3">
      <a href="/" class="px-5 py-3 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-slate-200 border border-white/[0.1] text-xs font-medium transition">
        ← Back to Homepage
      </a>
      <a href="/dashboard" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-[0_0_20px_rgba(37,99,235,0.4)] transition">
        Go to Dashboard 🚀
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-white/[0.08] bg-black/60 py-6 text-center text-xs text-slate-500">
    GlowSlides Inc. © 2026. All rights reserved.
  </footer>
  <script src="/js/cookie-consent.js"></script>
</body>
</html>
